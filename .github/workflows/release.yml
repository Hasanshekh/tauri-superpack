name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-crates:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Publish tauri-plugin-uniform
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/tauri-plugin-uniform/Cargo.toml || true

      - name: Publish tauri-plugin-browser-view
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/tauri-plugin-browser-view/Cargo.toml || true

      - name: Publish tauri-plugin-zerocopy
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/tauri-plugin-zerocopy/Cargo.toml || true

      - name: Publish tauri-plugin-cdp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/tauri-plugin-cdp/Cargo.toml || true

      - name: Publish tauri-plugin-isolate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path crates/tauri-plugin-isolate/Cargo.toml || true

  publish-npm:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish @tauri-superpack/plugin-uniform
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace crates/tauri-plugin-uniform/guest-js --access public || true

      - name: Publish @tauri-superpack/plugin-browser-view
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace crates/tauri-plugin-browser-view/guest-js --access public || true

      - name: Publish @tauri-superpack/plugin-zerocopy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace crates/tauri-plugin-zerocopy/guest-js --access public || true

      - name: Publish @tauri-superpack/plugin-cdp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace crates/tauri-plugin-cdp/guest-js --access public || true

      - name: Publish @tauri-superpack/plugin-isolate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace crates/tauri-plugin-isolate/guest-js --access public || true

      - name: Publish tauri-node-compat
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace packages/tauri-node-compat --access public || true
